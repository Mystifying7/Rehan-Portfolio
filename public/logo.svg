<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Cyan to Blue Glow Gradients -->
    <linearGradient id="cyberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Hexagonal Cyber Ring -->
  <polygon points="50,6 88,28 88,72 50,94 12,72 12,28" fill="url(#bgGradient)" stroke="url(#cyberGradient)" stroke-width="3" filter="url(#glow)" />

  <!-- Inner Hexagon Accent -->
  <polygon points="50,14 81,32 81,68 50,86 19,68 19,32" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4,4" opacity="0.6" />

  <!-- Stylized AI 'R' Core Vector Path -->
  <path d="M 36 28 L 54 28 C 64 28 68 34 68 41 C 68 48 62 53 54 53 L 36 53 Z M 36 53 L 36 72 M 52 53 L 66 72" fill="none" stroke="url(#cyberGradient)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- Neural Connection Nodes -->
  <circle cx="36" cy="28" r="3.5" fill="#22d3ee" />
  <circle cx="54" cy="28" r="3.5" fill="#38bdf8" />
  <circle cx="68" cy="41" r="3.5" fill="#3b82f6" />
  <circle cx="36" cy="53" r="3.5" fill="#22d3ee" />
  <circle cx="54" cy="53" r="3.5" fill="#38bdf8" />
  <circle cx="36" cy="72" r="3.5" fill="#22d3ee" />
  <circle cx="66" cy="72" r="3.5" fill="#3b82f6" />
</svg>
